<!doctype html>
<!--
  おまつりのビート / Festival Beat
  起動: このファイルをブラウザで開く。配信時は任意のサブディレクトリに置く。
  構成: HTML = 画面、CSS = レイアウト・記号、Canvas = 手描きのドット座標、
        JS = 翻訳・入力・判定、Web Audio = BGMと拍子木の合成。外部素材・通信なし。
  試験手順と確認環境は末尾のコメントを参照。
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F8F7EE">
  <link rel="icon" href="data:,">
  <title>おまつりのビート</title>
  <style>
    :root{color-scheme:light;--ink:#18251f;--paper:#f8f7ee;--lime:#ddeb98;--green:#385b4b;--dim:#43564a;--line:#b6bda8;--cream:#eeeddf;--orange:#f6bb79;--red:#9c3d2d;--mono:ui-monospace,Consolas,monospace}
    *,*::before,*::after{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;color:var(--ink);background:var(--paper);background-image:radial-gradient(#dadbca 0.7px,transparent 0.7px);background-size:12px 12px;font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;font-weight:550;line-height:1.55}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer;touch-action:manipulation}
    button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #2a6c58;outline-offset:4px}
    svg{width:1.25em;height:1.25em;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}
    .site{width:min(1160px,calc(100% - 88px));margin:auto}
    .mast{border-top:6px solid var(--ink);border-bottom:1px solid var(--line);background:var(--paper)}
    .mast .site,.foot .site{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px}
    .brand{display:flex;align-items:center;gap:11px;font:800 12px/1.15 var(--mono);letter-spacing:.09em}
    .brand-mark{display:grid;place-items:center;width:39px;height:39px;background:var(--ink);color:var(--lime)}
    .brand-mark svg{width:24px;height:24px}
    .tools,.languages{display:flex;align-items:center;gap:8px}
    .languages{padding:3px;border:1px solid var(--line);gap:3px;background:var(--paper)}
    .language,.sound-toggle{min-height:44px;border:0;background:transparent;font-weight:800;font-size:.83rem;padding:0 10px}
    .language{min-width:48px}
    .language[aria-pressed="true"]{color:var(--paper);background:var(--ink)}
    .sound-toggle{display:grid;place-items:center;width:46px;border:1px solid var(--ink);background:var(--paper)}
    .language:hover:not([aria-pressed="true"]),.sound-toggle:hover,.secondary:hover{background:var(--cream)}
    .volume{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:750;white-space:nowrap}
    .volume input{width:86px;height:44px;margin:0;accent-color:var(--green);cursor:pointer}
    .frame{display:grid;grid-template-columns:minmax(0, .87fr) minmax(0, 1.13fr);gap:clamp(26px,4.7vw,68px);align-items:center;padding-block:clamp(35px,6.3vw,88px)}
    .screen{min-width:0}
    .eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 17px;font:800 .77rem/1.4 var(--mono);letter-spacing:.095em;color:var(--dim)}
    .eyebrow::before{content:"";width:10px;height:10px;background:var(--green);box-shadow:3px 3px var(--lime);flex:none}
    h1,h2,p{margin-top:0}
    .hero{font-size:clamp(3.1rem,5.8vw,5.65rem);line-height:.99;letter-spacing:-.085em;font-weight:950;margin:0 0 25px}
    .hero span{display:block}
    .hero .under{width:max-content;max-width:100%;padding-right:.12em;background:linear-gradient(transparent 69%,var(--lime) 69%,var(--lime) 96%,transparent 96%)}
    html[lang="en"] .hero{letter-spacing:-.072em}
    .screen-title{font-size:clamp(2rem,4.3vw,3.75rem);letter-spacing:-.065em;font-weight:950;line-height:1.06;margin-bottom:16px}
    .lead{font-size:clamp(1rem,1.4vw,1.125rem);line-height:1.8;max-width:31em;color:var(--dim);margin:0 0 24px}
    .facts{margin:0 0 25px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--paper);border-block:1px solid var(--line)}
    .facts>div{padding:10px 9px 11px 0;min-width:0}
    .facts>div+div{border-left:1px solid var(--line);padding-left:clamp(8px,1.5vw,17px)}
    .facts dd{margin:0;font:900 1.65rem/1.2 var(--mono)}
    .facts dt{font-size:.77rem;color:var(--dim);line-height:1.3}
    .primary,.secondary{display:flex;align-items:center;justify-content:center;gap:11px;min-height:57px;padding:11px 16px;border:2px solid var(--ink);font-weight:850;line-height:1.3;text-align:center}
    .primary{background:var(--lime);box-shadow:4px 4px var(--ink)}
    .primary:hover{background:#eaf3b9}
    .primary:active{transform:translate(3px,3px);box-shadow:1px 1px var(--ink)}
    .secondary{background:var(--paper);min-height:52px}
    .wide{width:100%;justify-content:space-between;text-align:left}
    .actions{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin-top:17px}
    .instructions{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:8px}
    .instructions li{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start;font-size:.95rem;line-height:1.5}
    .instructions b{display:grid;place-items:center;background:var(--ink);color:var(--lime);font:800 .76rem var(--mono);height:26px}
    .guide-hint{margin:0 0 16px;color:var(--dim);font-size:.83rem;line-height:1.45}
    fieldset{margin:0;padding:0;border:0;min-inline-size:0}
    legend{padding:0;margin-bottom:6px;font-size:.87rem;font-weight:850}
    .choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .choices label{display:grid;cursor:pointer;min-width:0}
    .choices input{opacity:0;position:absolute;width:1px;height:1px}
    .choices span{display:grid;place-items:center;min-height:44px;border:1px solid var(--ink);background:var(--paper);font-size:.85rem;font-weight:800;text-align:center;padding:5px}
    .choices input:checked+span{background:var(--ink);color:var(--paper)}
    .choices input:focus-visible+span{outline:3px solid #2a6c58;outline-offset:2px}
    .difficulty-note{margin:7px 0 0;color:var(--dim);font-size:.82rem;min-height:2.6em;line-height:1.3}
    .stage{margin:0;background:var(--ink);border:3px solid var(--ink);box-shadow:7px 7px #bac2a7;min-width:0}
    .art{position:relative;background:#20443f;isolation:isolate}
    canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
    .art::after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid #f8f7ee38}
    .stage-label{color:var(--paper);min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;font-weight:800;font-size:.82rem}
    .stage-label .serial{font:800 .72rem var(--mono);letter-spacing:.08em;color:var(--lime);margin-right:9px}
    .badge-flags{display:flex;align-items:center;gap:6px}
    .flag-glyph{display:grid;place-items:center;width:23px;height:23px;background:var(--orange);color:var(--ink);font-size:17px;line-height:1;font-family:Arial,sans-serif;font-weight:900}
    .flag-glyph+ .flag-glyph{background:var(--lime)}
    .tap-wrap{padding:8px;background:var(--ink)}
    .tap{box-shadow:none;width:100%;min-height:65px;justify-content:space-between;border:2px solid var(--lime);font-size:1.25rem;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    .tap:focus-visible{outline:3px solid var(--paper);outline-offset:-6px}
    .tap:active,.tap[data-down="true"]{transform:none;box-shadow:inset 0 4px #81904a;background:#eaf3b9}
    .tap kbd{font:800 .73rem var(--mono);border:1px solid var(--green);padding:4px 5px;white-space:nowrap}
    .tap-label{display:flex;align-items:center;gap:10px}
    .play-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .play-top .eyebrow{margin-bottom:8px}
    .timer{display:grid;justify-items:end;white-space:nowrap;line-height:1.15;color:var(--dim);font-size:.74rem}
    .timer strong{font:900 1.55rem var(--mono);color:var(--ink)}
    .play-title{font-size:clamp(1.55rem,3.1vw,2.55rem);font-weight:950;letter-spacing:-.05em;margin:0 0 11px;line-height:1.05}
    .beat-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-bottom:15px}
    .beat-grid span{display:grid;place-items:center;height:clamp(20px,3vw,33px);font:800 .72rem var(--mono);background:var(--paper);border:1px solid var(--line)}
    .beat-grid span[data-mark="hit"]{background:var(--lime);border-color:var(--ink)}
    .beat-grid span[data-mark="miss"]{background:var(--cream);color:var(--dim)}
    .beat-grid span[data-current="true"]{outline:2px solid var(--ink);outline-offset:-2px}
    .metronome{border:1px solid var(--ink);background:var(--paper);padding:11px 12px 12px;margin-bottom:11px}
    .metro-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:33px;font-size:.83rem;color:var(--dim);font-weight:800}
    .beat-now{color:var(--paper);background:var(--ink);padding:4px 8px;font-size:.82rem;white-space:nowrap}
    .beat-now[data-cue="now"]{color:var(--ink);background:var(--lime);outline:2px solid var(--ink)}
    .track{height:16px;position:relative;margin:6px 8px 0}
    .track::before{content:"";position:absolute;inset:7px 0;height:2px;background:var(--line)}
    .track::after{content:"";position:absolute;right:-3px;top:0;width:6px;height:16px;background:var(--ink)}
    .track-dot{position:absolute;left:0;top:3px;width:10px;height:10px;background:var(--green);transform:translateX(-50%) rotate(45deg);z-index:1}
    .feedback{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:31px;margin-bottom:6px}
    .feedback span:first-child{font-size:.95rem;font-weight:900}
    .feedback span[data-tone="miss"]{color:var(--red)}
    .feedback span:last-child{white-space:nowrap;font:900 .89rem var(--mono)}
    .stage-cue{position:absolute;inset:0;pointer-events:none;border:0 solid var(--lime);display:grid;justify-items:center;align-content:start;padding-top:5%;z-index:1}
    .stage-cue[data-cue="now"]{border-width:5px}
    .stage-cue span{display:none;align-items:center;gap:8px;padding:2px 10px;background:var(--lime);color:var(--ink);box-shadow:3px 3px var(--ink);font-weight:950;font-size:clamp(.9rem,2.5vw,1.45rem);line-height:1.4}
    .stage-cue[data-cue="now"] span{display:flex}
    .results{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:20px 0 16px}
    .results>div{background:var(--paper);padding:12px 14px}
    .results dt{font-size:.79rem;color:var(--dim)}
    .results dd{margin:0;font:900 clamp(1.32rem,3vw,2rem) var(--mono);white-space:nowrap}
    .results small{font-size:.62em;color:var(--dim)}
    .foot{background:var(--paper);border-block:1px solid var(--line)}
    .foot .site{min-height:60px}
    .fiction{font-size:.79rem;line-height:1.45;color:var(--dim);margin:0}
    .fiction::before{content:"◇";display:inline-block;margin-right:6px;font-weight:950}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    @media (hover:none) and (any-pointer:coarse){.tap kbd{display:none}}
    @media(max-width:840px){.site{width:calc(100% - 48px)}.frame{gap:26px}.hero{font-size:clamp(2.9rem,6.7vw,4.5rem)}}
    @media(max-width:660px){
      .site{width:calc(100% - 34px)}.mast .site{min-height:62px}.frame{display:flex;flex-direction:column;align-items:stretch;gap:25px;padding-block:30px 34px}
      .hero{font-size:clamp(3rem,12.1vw,4.8rem);margin-bottom:16px}.eyebrow{margin-bottom:13px}.lead{margin-bottom:16px;line-height:1.65}
      .facts{margin-bottom:15px}.stage{box-shadow:4px 4px #bac2a7}.stage-label{min-height:44px}
      .frame[data-page="play"]{padding-block:15px 20px;gap:9px}.beat-grid{margin-bottom:8px}.metronome{padding:3px 8px 7px;margin-bottom:5px}
      .play-title{margin-bottom:7px}.feedback{margin-bottom:0;min-height:26px}.play-top .eyebrow{margin-bottom:4px}
      .frame[data-page="play"] canvas{width:100%;height:auto;max-height:clamp(72px,calc(100svh - 400px),250px);object-fit:cover;object-position:center 65%}
      .tap-wrap{padding:5px}.tap{min-height:60px}.foot .site{gap:8px}.volume{gap:4px}.volume input{width:60px}
    }
    @media(min-width:661px) and (max-height:590px){.frame[data-page="play"]{padding-block:15px}.frame[data-page="play"] canvas{max-height:clamp(72px,calc(100svh - 183px),280px);object-fit:cover;object-position:center 63%}}
    @media(max-width:360px){.site{width:calc(100% - 24px)}.tools{gap:4px}.brand{gap:6px;font-size:.66rem}.brand-mark{width:32px;height:32px}.language{padding-inline:6px}.actions{gap:8px}.actions button{padding-inline:8px}}
    @media(prefers-reduced-motion:reduce){.primary:active{transform:none}}
  </style>
</head>
<body>
  <svg class="sr-only" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="sticks" viewBox="0 0 24 24"><path d="m3 17 11-11 4 4L7 21zM10 16l5 5 4-4-5-5M5 3v3M2 7h3M19 2v3M22 7h-3"/></symbol>
    <symbol id="speaker" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM15 9c2 1 2 5 0 6m3-9c4 3 4 9 0 12"/></symbol>
    <symbol id="silent" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 9l5 6m0-6-5 6"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M3 12h17m-7-7 7 7-7 7"/></symbol>
    <symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V3m0 1h14l-3 4 3 4H5"/></symbol>
  </svg>
  <header class="mast">
    <div class="site">
      <div class="brand" aria-label="Hiroba Rhythm Club"><span class="brand-mark"><svg aria-hidden="true"><use href="#sticks"/></svg></span><span aria-hidden="true">HIROBA<br>RHYTHM CLUB</span></div>
      <div class="tools">
        <div class="languages" id="languages" role="group" data-label="language">
          <button type="button" class="language" lang="ja" data-lang="ja" aria-pressed="true">日本語</button>
          <button type="button" class="language" lang="en" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="sound-toggle" id="mute" aria-pressed="false" data-label="mute"><svg aria-hidden="true"><use href="#speaker"/></svg></button>
      </div>
    </div>
  </header>
  <main class="frame site" id="frame" data-page="title">
    <section class="screen" id="title" aria-labelledby="game-title">
      <p class="eyebrow" data-t="titleKicker"></p>
      <h1 class="hero" id="game-title" tabindex="-1"><span data-t="title1">おまつりの</span><span class="under" data-t="title2">ビート</span></h1>
      <p class="lead" data-t="intro"></p>
      <dl class="facts"><div><dd>16</dd><dt data-t="beats"></dt></div><div><dd>12</dd><dt data-t="toWin"></dt></div><div><dd>01</dd><dt data-t="players"></dt></div></dl>
      <button class="primary wide" type="button" id="guide-button"><span data-t="guideButton"></span><svg aria-hidden="true"><use href="#arrow"/></svg></button>
    </section>
    <section class="screen" id="guide" aria-labelledby="guide-heading" hidden>
      <p class="eyebrow" data-t="guideKicker"></p>
      <h2 class="screen-title" id="guide-heading" tabindex="-1" data-t="guideHeading"></h2>
      <ol class="instructions">
        <li><b aria-hidden="true">01</b><span data-t="step1"></span></li>
        <li><b aria-hidden="true">02</b><span data-t="step2"></span></li>
        <li><b aria-hidden="true">03</b><span data-t="step3"></span></li>
      </ol>
      <p class="guide-hint" data-t="keys"></p>
      <fieldset><legend data-t="difficulty"></legend><div class="choices">
        <label><input type="radio" name="level" value="easy"><span data-t="easy"></span></label>
        <label><input type="radio" name="level" value="normal" checked><span data-t="normal"></span></label>
        <label><input type="radio" name="level" value="hard"><span data-t="hard"></span></label>
      </div></fieldset>
      <p class="difficulty-note" id="difficulty-note"></p>
      <div class="actions"><button class="primary wide" type="button" id="start"><span data-t="start"></span><svg aria-hidden="true"><use href="#arrow"/></svg></button><button class="secondary home" type="button" data-t="home"></button></div>
    </section>
    <section class="screen" id="play" aria-labelledby="play-heading" hidden>
      <div class="play-top"><p class="eyebrow" id="play-kicker"></p><div class="timer"><span data-t="timeLeft"></span><strong id="time-left">1:00</strong></div></div>
      <h2 class="play-title" id="play-heading" data-t="playHeading"></h2>
      <div class="beat-grid" id="beat-grid" aria-hidden="true"></div>
      <div class="metronome">
        <div class="metro-top"><span id="next-beat"></span><span class="beat-now" id="cue-word"></span></div>
        <div class="track" id="track" aria-hidden="true"><span class="track-dot" id="track-dot"></span></div>
      </div>
      <div class="feedback"><span id="feedback" role="status"></span><span id="live-score"></span></div>
    </section>
    <section class="screen" id="result" aria-labelledby="result-heading" hidden>
      <p class="eyebrow" data-t="resultKicker"></p>
      <h2 class="screen-title" id="result-heading" tabindex="-1"></h2>
      <p class="lead" id="result-copy"></p>
      <dl class="results"><div><dt data-t="score"></dt><dd><span id="final-score"></span><small> / 160</small></dd></div><div><dt data-t="onBeat"></dt><dd><span id="final-hits"></span><small> / 16</small></dd></div></dl>
      <div class="actions"><button class="primary wide" type="button" id="retry"><span data-t="retry"></span><svg aria-hidden="true"><use href="#arrow"/></svg></button><button class="secondary home" type="button" data-t="home"></button></div>
    </section>
    <figure class="stage" aria-labelledby="stage-label" id="stage">
      <div class="art">
        <canvas id="scene" width="320" height="204" aria-hidden="true"></canvas>
        <div class="stage-cue" id="stage-cue" aria-hidden="true" hidden><span><svg><use href="#sticks"/></svg><b data-t="now"></b></span></div>
      </div>
      <figcaption class="stage-label" id="stage-label"><span><span class="serial" aria-hidden="true">01 /</span><span data-t="stage"></span></span><span class="badge-flags" aria-hidden="true"><span class="flag-glyph">○</span><span class="flag-glyph">◆</span></span></figcaption>
      <div class="tap-wrap" id="tap-wrap" hidden><button class="primary tap" id="tap" type="button"><span class="tap-label"><svg aria-hidden="true"><use href="#flag"/></svg><span data-t="tap"></span></span><kbd aria-hidden="true">SPACE / ENTER</kbd></button></div>
    </figure>
  </main>
  <footer class="foot"><div class="site"><p class="fiction" data-t="fiction"></p><label class="volume"><span data-t="volume"></span><input id="volume" type="range" min="0" max="100" value="55"></label></div></footer>
  <script>
  'use strict';
  const words = {
    ja: {
      name:'おまつりのビート',language:'言語',mute:'ミュート',volume:'音量',titleKicker:'ひろばのリズムゲーム',title1:'おまつりの',title2:'ビート',
      intro:'カチッ、カチッ。拍子木の合図に合わせて紙の旗をふろう。丸とひし形の旗で、夕暮れの広場を彩ってね。',
      beats:'合図の数',toWin:'回で成功',players:'人であそぶ',guideButton:'あそび方へ',stage:'ちょうちん広場',fiction:'このお祭り・広場・登場人物は架空です。',
      guideKicker:'あそぶ前に',guideHeading:'あそび方',step1:'拍子木の音か、画面の「いま！」を合図にしてね。',
      step2:'旗のボタンをタップ・クリック。Space または Enter でも旗をふれるよ。',step3:'合図は16回。ぴったりで10点、12回以上で成功！ 制限時間は60秒。',
      keys:'メニューの移動と難易度の選択は矢印キーでもできます。',difficulty:'むずかしさ',easy:'かんたん',normal:'ふつう',hard:'むずかしい',
      easyNote:'ゆっくり。次の合図の目安が長く出ます。',normalNote:'ふつうの速さ。次の合図の目安が出ます。',hardNote:'速め。拍子木の音か「いま！」が手がかりです。',
      start:'スタート',home:'タイトルへ',playKicker:'プレイ中',playHeading:'拍に合わせよう',timeLeft:'のこり時間',
      next:(n,total)=>`${n} / ${total} 拍目`,now:'いま！',ready:'よーい',soon:'つぎの合図',
      tap:'旗をふる',wait:'合図を待ってね',hit:'✓ ぴったり！',early:'← はやい',late:'→ おそい',points:n=>`${n} 点`,
      resultKicker:'リザルト',win:'成功！',tryAgain:'おつかれさま！',timeout:'時間切れ',
      winCopy:'12回以上、拍に合いました。',missCopy:'成功まであと{n}回。',timeCopy:'60秒が経過しました。',score:'スコア',onBeat:'拍に合った回数',retry:'もう一度'
    },
    en: {

    手動の確認手順
    1. 日本語とENを切り替え、タイトルから遊び方へ。しばらく待ち、スタート後に1:00から
       計測が始まることを確認する。矢印でメニューや難易度を選び、EnterまたはSpaceで進む。
    2. ふつうで「いま！」に合わせて旗ボタンを押す。ぴったりなら10点。合図の直前・直後に
       ずらして押し、「はやい」「おそい」と表示されることも確認する。12拍で120点・成功、
       最大160点。通常は最終拍の判定後（ふつうは開始から約18秒）に終わる。
    3. リザルトの「もう一度」で点数・旗・残り時間が初期化されること、タイトルにも戻れる
       ことを確認する。無音にし、スマートフォン幅で「いま！」とタップだけで同じ操作を試す。
       かんたんは合図の表示と予告が長く、むずかしいは予告の目盛りがなく速い。
    4. 60秒分の中断を再現するには、Chrome/Edgeの開発者ツールで開始直後に次を一度実行する。
       { const saved = performance.now; const shifted = saved.bind(performance);
         try { performance.now = () => shifted() + 60001;
               document.dispatchEvent(new Event('visibilitychange')); }
         finally { performance.now = saved; } }
       直ちに「時間切れ」が表示され、再試行で1:00から始まれば合格。

    日英、Web Audioの予約、±180msの境界、成功、再試行、仮想時計による60秒の時間切れ）、
    Edge 156.0.4314.58（320×568のタッチエミュレーション、オフライン file://、無音、未達成、
