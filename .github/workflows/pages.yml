name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build:games
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify public site
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          base="${PAGES_URL%/}"
          curl -fsSL --max-time 15 --retry 5 --retry-all-errors --retry-delay 5 "$base/" -o "$RUNNER_TEMP/oshima-index.html"
          grep -Fq '<title>OSHIMA GAME PROMPT STUDIO</title>' "$RUNNER_TEMP/oshima-index.html"
          curl -fsSL --max-time 15 --retry 5 --retry-all-errors --retry-delay 5 "$base/styles.css" -o /dev/null
          curl -fsSL --max-time 15 --retry 5 --retry-all-errors --retry-delay 5 "$base/js/app.js" -o /dev/null
          curl -fsSL --max-time 15 --retry 5 --retry-all-errors --retry-delay 5 "$base/play.html" -o /dev/null
          curl -fsSL --max-time 15 --retry 5 --retry-all-errors --retry-delay 5 "$base/js/play.js" -o /dev/null
          curl -fsSL --max-time 15 --retry 5 --retry-all-errors --retry-delay 5 "$base/vendor/qrcode-generator.js" -o /dev/null
          curl -fsSL --max-time 15 --retry 5 --retry-all-errors --retry-delay 5 "$base/games/sorting-demo.json" -o /dev/null
          curl -fsSL --max-time 15 --retry 5 --retry-all-errors --retry-delay 5 "$base/gallery.html" -o /dev/null
          curl -fsSL --max-time 15 --retry 5 --retry-all-errors --retry-delay 5 "$base/games/index.json" -o /dev/null
