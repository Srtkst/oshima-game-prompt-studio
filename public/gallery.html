<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OSHIMA GAME PROMPT STUDIOの登録済みゲーム作品一覧。">
  <title>ゲーム作品一覧 | OSHIMA GAME PROMPT STUDIO</title>
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip" href="#main">本文へ移動</a>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="./" aria-label="スタジオのホーム">
        <img src="./assets/logo.svg" width="36" height="36" alt="">
        <span>OSHIMA<span class="brand-sub">GAME PROMPT STUDIO</span></span>
      </a>
      <a class="header-link" href="./play.html">HTMLで遊ぶ ↗</a>
    </div>
  </header>
  <main id="main" class="container gallery" tabindex="-1">
    <section class="panel gallery-intro" aria-labelledby="gallery-title">
      <div>
        <p class="eyebrow">PLAY GALLERY</p>
        <h1 id="gallery-title">ゲーム作品一覧</h1>
        <p class="intro">気になるカードを選んで、ブラウザーで遊ぼう。</p>
      </div>
      <div class="field gallery-search" hidden>
        <label class="field-label" for="game-search">作品を探す</label>
        <input type="search" id="game-search" placeholder="作品名・紹介文・作品ID" autocomplete="off">
      </div>
    </section>
    <p class="gallery-count" id="gallery-status" role="status">作品一覧を読み込んでいます…</p>
    <ul class="gallery-grid" id="gallery-grid" aria-label="登録済みのゲーム作品"></ul>
    <noscript>作品一覧を表示するにはJavaScriptを有効にしてください。</noscript>
  </main>
  <footer class="container site-footer"><span>OSHIMA GAME PROMPT STUDIO</span><span>PLAY GALLERY</span></footer>
  <script type="module" src="./js/gallery.js"></script>
</body>
</html>
